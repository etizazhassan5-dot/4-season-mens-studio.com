<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Temporarily Unavailable</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#14213d;padding:20px}
.card{width:min(720px,100%);background:#fff;border-radius:24px;padding:48px 28px;text-align:center;box-shadow:0 12px 40px rgba(20,33,61,.10)}
.icon{font-size:72px;margin-bottom:18px}
h1{font-size:clamp(30px,7vw,52px);margin:0 0 14px;font-weight:700}
.line{width:80px;height:5px;background:#f5a900;border-radius:5px;margin:0 auto 28px}
p{font-size:18px;line-height:1.7;color:#52627a;margin:8px 0}
.note{margin-top:28px;padding:18px;background:#eef6ff;border-radius:14px;color:#203a60}
.small{font-size:15px;margin-top:24px}
</style>
</head>
<body>
<main class="card">
  <div class="icon">🚧</div>
  <h1>Website Temporarily Unavailable</h1>
  <div class="line"></div>
  <p>We are currently making some improvements.</p>
  <p>Please check back soon.</p>
  <div class="note">For any inquiries, please contact us.</div>
  <p class="small">Thank you for your patience and support!</p>
</main>
</body>
</html>
